<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2nd Animation Layout</title>
</head>
<style>
    #nav{
        height:50px;
        width:99vw;
        background:linear-gradient(45deg,rgb(206, 246, 246),rgb(255, 211, 255)) ;
         text-align:center;
        align-content:center;
        /* margin:20px 0px; */
    }
    #logo{
        display:inline-block;
        position:fixed;
        top:13px;
        left:17px;
        text-align:center;
        align-content:center;
        font-size:35px;
        height:40px;
        width:170px;
        background:linear-gradient(45deg,orange,yellow);
    }
    #end{
         display:inline-block;
        position:fixed;
        top:18px;
        right:25px;
        font-size:20px;
    }
    #heading-box{
        margin:20px 0px;     
        width:99.0vw;
        height:200px;
        background: linear-gradient(70deg,rgb(187, 187, 248),rgb(247, 203, 203));
         text-align:center;
        align-content:center;
    }
    #heading{
        font-size:55px;
        margin:10px;
    }
    #small{
        text-decoration: none;
        font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        color:rgb(103, 102, 102)
    }
    #content{
        width:99vw;
        height:430px;
        display:flex;
        /* background-color: blue; */
    }
    #items{
        height:420px;
        width:21.5%;
        /* background-color: green; */
        box-shadow:2px 0px 10px -2px;
        margin:15px 25px;
        border-radius:30px;
         text-align:center;
        /* align-content:center; */
    
    }
    img{
        margin: 10px 10px;
        border-radius:15px;
        width: 94%;
        height:65%;
    }
    .heading2{
        
        margin:45px 0px;
        margin-top:5px;
        display:inline-block;
    }
    .cart-box{
        /* display:inline-block; */
         /* text-align:center; */
        align-content:center;
        color:white;
       
        font-size:20px;
        /* margin:30px 0px; */
        background-color: rgb(73, 73, 249);
        height:35px;
        width:280px;
        border-radius:8px;
    }
    a{
        display:inline-block;
         font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        text-decoration: none;

    }
</style>
