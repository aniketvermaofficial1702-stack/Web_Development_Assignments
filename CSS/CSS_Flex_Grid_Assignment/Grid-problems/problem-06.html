<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout 5</title>
    <style>
        #main {
            display: flex;
            justify-content: center;
            
            /* margin:20px; */
            /* padding: 20px; */
        }
        #headings{
          display: flex;
            justify-content: center; 
            margin:20px;  
        }
        h1{
            margin:0px;
            padding:0px;
            font-size:50px;
        }
        #calc-box{
            /* justify-content: center; */
            margin:10px;
            border:5px solid black;
            padding:10px 25px;
            border-radius:30px;
            box-shadow:0px 0px 40px -2px;
        }
        #grid-part {
            /* margin:30px ; */
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(5, 100px);
            grid-gap: 20px;
        }

        .boxes {
            background: linear-gradient(rgb(232, 187, 255), rgb(252, 210, 210));
            border-radius: 20px;
            box-shadow:9px 15px 35px -20px;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:xx-large;
        }
        #result{
            grid-area:1/1/2/5;
            background:linear-gradient(rgb(255, 243, 243),rgb(255, 213, 213));
        }
        #plus{
            /* grid-area:1/1/2/5; */
            background:linear-gradient(-45deg,rgb(160, 159, 159),rgb(218, 199, 199));
        }
        #minus{
            /* grid-area:1/1/2/5; */
            background:linear-gradient(-45deg,rgb(160, 159, 159),rgb(218, 199, 199));
        }
        #multi{
            /* grid-area:1/1/2/5; */
            background:linear-gradient(-45deg,rgb(160, 159, 159),rgb(218, 199, 199));
        }
        #Cons{
            /* grid-area:1/1/2/5; */
            background:linear-gradient(-45deg,rgb(255, 123, 123),rgb(253, 73, 226));
        }
        #equal{
            /* grid-area:1/1/2/5; */
            background:linear-gradient(-45deg,rgb(160, 159, 159),rgb(218, 199, 199));
        }
        #div{
            /* grid-area:1/1/2/5; */
            background:linear-gradient(-45deg,rgb(160, 159, 159),rgb(218, 199, 199));
        }

    </style>
</head>

<body>
    <div id="main">
        <div id="calc-box">
            <div id="headings"><h1>Calculator</h1></div>
            <div id="grid-part">
                <div id="result" class="boxes"></div>
                <button class="boxes"><b>1</b> </button>
                <button class="boxes"><b>2</b></button>
                <button class="boxes"><b>3</b></button>
                <button id="plus" class="boxes"><b>+</b></button>
                <button class="boxes"><b>4</b></button>
                <button class="boxes"><b>5</b></button>
                <button class="boxes"><b>6</b></button>
                <button id="minus" class="boxes"><b>-</b></button>
                <button class="boxes"><b>7</b></button>
                <button class="boxes"><b>8</b></button>
                <button class="boxes"><b>9</b></button>
                <button id="multi" class="boxes"><b>*</b></button>
                <button id="Cons" class="boxes"><b>C</b></button>
                <button class="boxes"><b>0</b></button>
                <button id="equal" class="boxes"><b>=</b></button>
                <button id="div" class="boxes"><b>\</b></button>
            </div>
        </div>
    </div>
</body>

</html>
