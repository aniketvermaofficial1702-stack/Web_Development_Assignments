    <title>grid layout 4</title>
    <style>
        #main {
            margin:50px;
            padding:30px;
            display:flex;
            /* flex-direction:column; */
        }
        #grid-part{
            margin:40px;
            display:grid;
            grid-template-columns:repeat(4,120px);
            grid-template-rows:repeat(3,120px);
            grid-gap:20px;
        }
         .boxes2{
            /* border:2px solid blue; */
            border-radius:20px;
            background-color:green;
         }
        .boxes{
            /* border:2px solid blue; */
            border-radius:20px;
            background:linear-gradient(-45deg,rgb(251, 251, 186),rgb(255, 185, 255));

        }
        #grid-part>div:nth-child(2){
            grid-area:1/2/2/4;
        }
        #grid-part>div:nth-child(4){
            grid-area:2/1/3/3;
        }
        #grid-part>div:nth-child(9){
            grid-area:3/3/4/5;
        }
    </style>
</head>
