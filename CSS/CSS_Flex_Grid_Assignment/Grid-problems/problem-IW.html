<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>keyboard</title>
    <style>
        .rows{
            border:2px solid black;
            width:1200px;
            background-color: #252C2C;
            display:grid;
            grid-template-columns:repeat(12,100px);
            grid-template-rows:repeat(5,50px);
            /* grid-column-gap: 5px; */
            /* grid-template-areas:"q w e r t y u i o p w w"
                                "a f s g r h v s f h j s"
                                "s h k t j c e j j f k n"
                                "q r t y u d a c b n g s"
                                "g a f s d t r w s b j k" */
            box-shadow: 0px 0px 65px 19px rgba(234, 4, 4, 0.3);
            border-radius:20px;
            padding:20px;
            /* padding-top: 20px;
            padding-top: 20px;
            padding-top: 20px;
            padding-top: 20px; */
        }
        .keys{
            background-color:rgb(112, 112, 251);
            /* height:40px; */
             margin:7px;
            display:flex;
            justify-content:center;
            align-items:center;
            border-radius: 4px;
            box-shadow:0px 8px 19px -2px  rgba(5, 252, 145, 0.3) ;
        }
        .rows>div:hover,#key1:hover,#key2:hover,#key3:hover{
            background-color: red;

        }
        #key1{
            grid-area: 3/-3/4/-1;
            background-color:rgb(112, 112, 251);
            /* height:40px; */
            margin:7px;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        #key2{
            grid-area: 4/-3/5/-1;
            background-color:rgb(112, 112, 251);
            /* height:40px; */
             margin:7px;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        #key3{
            grid-area: 5/-9/6/-5;
            background-color:rgb(112, 112, 251);
            /* height:40px; */
            margin:7px;
            display:flex;
            justify-content:center;
            align-items:center;
        }
    </style>
</head>
<body>
    <!-- <div id="layout"> -->
    <div class="rows">
          <div class="keys">~</div>
             <div class="keys">1</div>
            <div class="keys">2</div>
            <div class="keys">3</div>
            <div class="keys">4</div>
            <div class="keys">5</div>
            <div class="keys">6</div>
            <div class="keys">7</div>
            <div class="keys">8</div>
            <div class="keys">9</div>
            <div class="keys">0</div>
            <div class="keys">delete</div>

           <div class="keys">tab</div>
            <div class="keys">Q</div>
            <div class="keys">W</div>
            <div class="keys">E</div>
            <div class="keys">R</div>
            <div class="keys">T</div>
            <div class="keys">Y</div>
            <div class="keys">U</div>
            <div class="keys">I</div>
            <div class="keys">O</div>
            <div class="keys">P</div>
            <div class="keys">\</div>

             <div class="keys">caps</div>
            <div class="keys">A</div>
            <div class="keys">S</div>
            <div class="keys">D</div>
            <div class="keys">F</div>
            <div class="keys">G</div>
            <div class="keys">H</div>
            <div class="keys">J</div>
            <div class="keys">K</div>
            <div class="keys">L</div>
            <div id="key1" class="keys">Enter</div>
            <!-- <div class="keys"></div> -->

             <div class="keys">Shift</div>
            <div class="keys">Z</div>
            <div class="keys">X</div>
            <div class="keys">C</div>
            <div class="keys">V</div>
            <div class="keys">B</div>
            <div class="keys">N</div>
            <div class="keys">M</div>
            <div class="keys"><</div>
            <div class="keys">></div>
            <div id="key2" class="keys">Shift</div>
             <!-- <div class="keys"></div> -->

            <div class="keys">🌐</div>
            <div class="keys">Ctrl</div>
            <div class="keys">Options</div>
            <div class="keys">alt</div>
            <div id="key3" class="keys">Space</div>
            <div class="keys">alt</div>
            <div class="keys">Options</div>
            <div class="keys">←</div>
            <div class="keys">→</div>   
    </div>
</body>
</html>
