<!DOCTYPE html>
<html lang="en">
<head>
    <title>Movie Card</title>
    <style>
        #main{
            height: 200 px
            /* border: 2px solid red; */
            padding : 10px;
        }
        .sub-class{
             height: 200px;
            /* border: 2px solid blue; */
            margin: 20px;
            padding: 5px;
        }
        .movie-card{
            padding: 5px;
            height: 200px;
            width: 45%;
            border: 2px solid green;
            display: inline-block;
            margin: 20px 10px;
        }
        .image{
        height: 100%;
            width: 30%;
            display: inline-block;
        }
        
        .movie-card-inner-box{
            padding: 5px;
            width: 60%;
            display: inline-block;
            text-align: center;
        }
        k
        .book{
            display: inline-block;
            text-align: center;
            height: 50px;
            width: 120px;
            border: 2pxsolid black;
            background-color: red;
        }
        .heading{
            display: inline-block;
            margin: 0px;
        }


    </style>
</head>
<body>
    <div id="main">
        <!-- 1st bloack -->
        <div class="sub-class">
            <div class="movie-card">
                <!-- image box -->
                <img  class="image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfOVWOyA9jZmzQi3nCCmEvOOlxW0GRCDrV--eEfBXGwA&s=10" alt="RRR">
                <div class="movie-card-inner-box">
                    <h3 class="heading">RRR</h3>
                    <p class="para">Releasing on 29Feb,2026</p>
                    <div class="book">
                        <p>Book Tickets</p>
                    </div>
                </div>
            </div>
            <div class="movie-card"></div>
        </div>

        <!-- 2nd bloack -->
         <div class="sub-class">
          <div class="movie-card"></div>
            <div class="movie-card"></div>
        </div>

            <!-- 3rd bloack -->
        <div class="sub-class"> 
            <div class="movie-card"></div>
            <div class="movie-card"></div>
        </div>
    </div>
</body>
</html>
